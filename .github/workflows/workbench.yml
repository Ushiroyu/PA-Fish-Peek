name: Workbench checks
on:
  push:
    branches: [main]
    paths: ['assistant/**', 'src/PAFishPeekPlugin/**', 'scripts/export-catalog.py', 'scripts/run-mcp-demo.py', 'docs/examples/*.json', '.github/workflows/workbench.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r assistant/requirements.lock
      - run: python -m pip install --no-deps -e assistant
      - run: python scripts/export-catalog.py --check
      - run: python -m pytest assistant/tests -q
      - run: python -m fishpeek.evaluate --output artifacts/evaluation.json
      - run: python -m fishpeek.evaluate_retrieval --check-reference --output artifacts/retrieval-evaluation.json
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-evaluation-${{ matrix.os }}
          path: |
            artifacts/evaluation.json
            artifacts/retrieval-evaluation.json
            artifacts/retrieval-evaluation.md
