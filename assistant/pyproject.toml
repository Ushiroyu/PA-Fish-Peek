[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fishpeek-workbench"
version = "0.1.0"
description = "PA Fish Peek 查询、检索与工具调用工作台"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "mcp>=1.20,<2", "pydantic-settings>=2.5,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
fishpeek = "fishpeek.__main__:main"

[tool.setuptools.packages.find]
include = ["fishpeek*"]

[tool.setuptools.package-data]
fishpeek = ["data/*.json", "knowledge/*.md", "static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
