<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PA Fish Peek · 钓鱼分析工作台</title>
<style>
:root{font:16px/1.65 system-ui,"Microsoft YaHei",sans-serif;color:#e7eee9;background:#101b19}*{box-sizing:border-box}body{max-width:1080px;margin:auto;padding:36px 24px}h1{font-size:32px;line-height:1.25;margin-bottom:8px}p{color:#a6bdb1}header{border-bottom:1px solid #34473c;padding-bottom:24px;margin-bottom:28px}.tag{color:#c0df72;font-size:13px}main{display:grid;grid-template-columns:290px 1fr;gap:24px}.panel{background:#192824;border:1px solid #34473c;border-radius:12px;padding:20px}label{display:block;font-size:14px;color:#bdcfc4;margin-top:12px}input,select,textarea,button{font:inherit;border:1px solid #4b6054;border-radius:6px;padding:9px;color:#e7eee9;background:#101b19;width:100%}textarea{min-height:115px;resize:vertical}button{cursor:pointer;background:#c0df72;color:#15201a;border:0;margin-top:14px;font-weight:600}button:disabled{opacity:.5;cursor:wait}pre{white-space:pre-wrap;word-break:break-word;font:14px/1.7 inherit}.source{border-left:2px solid #c0df72;margin:16px 0;padding-left:12px;color:#bdcfc4}.muted{font-size:13px;color:#a6bdb1}details{margin-top:16px}a{color:#c0df72}@media(max-width:720px){main{grid-template-columns:1fr}}
</style>
<header><span class="tag">PA FISH PEEK / WORKBENCH</span><h1>钓鱼分析工作台</h1><p>查询候选，解释条件，追踪每一次工具调用。</p><div id="health" class="muted">正在连接本地服务…</div></header>
<main><aside class="panel"><strong>查询条件</strong><label>精确鱼竿<select id="rod"><option value="">按模式与竿型</option></select></label><label>模式<select id="mode"><option value="route">河边</option><option value="ice">冰洞</option><option value="pond">池塘</option></select></label><label>竿型<select id="accessory"><option value="2">重竿</option><option value="1">轻竿</option></select></label><label>鱼等级<input id="level" type="number" min="1" max="6" value="6"></label><label>地点<select id="location"><option value="0">按模式查询</option><option value="1">河湾</option><option value="2">码头</option><option value="4">岸边</option><option value="8">河中央</option><option value="16">沉船</option><option value="32">巨石</option><option value="64">冰洞</option><option value="128">池塘</option></select></label><label>季节<select id="season"><option value="4">秋</option><option value="1">春</option><option value="2">夏</option><option value="8">冬</option><option value="0">未知</option></select></label><label>天气<select id="weather"><option value="64">流星雨</option><option value="1">晴朗</option><option value="2">雾</option><option value="4">小雪</option><option value="8">大雪</option><option value="16">小雨</option><option value="32">大雨</option><option value="0">未知</option></select></label><label><input id="useContext" type="checkbox" checked style="width:auto"> 使用上述条件</label><button id="query">计算候选</button><button id="events">查看最近遭遇</button></aside>
<section><div class="panel"><label for="question">问题</label><textarea id="question">为什么这次候选中有流星鱼？天气对排序有什么影响？</textarea><label>问答方式<select id="answerMode"><option value="auto">自动选择</option><option value="local">本地检索与规则解释</option><option value="model">模型工具调用</option></select></label><button id="ask">开始分析</button><p class="muted">分数用于候选排序；查询条件由你指定，与实机状态分别展示。</p></div><div class="panel" style="margin-top:20px"><strong id="resultTitle">查询结果</strong><pre id="answer">选择查询条件后开始分析。</pre><div id="sources"></div><details><summary>调用记录</summary><pre id="trace"></pre></details></div></section></main>
<script>
const $=id=>document.getElementById(id);const context=()=>({rod_id:$('rod').value||null,mode:$('mode').value,accessory:+$('accessory').value,level:+$('level').value,location:+$('location').value,season:+$('season').value,time:0,weather:+$('weather').value});
async function api(path,body){const response=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});if(!response.ok)throw new Error('请求失败：'+response.status);return response.json()}
function show(text){$('answer').textContent=text;$('sources').replaceChildren();$('trace').textContent=''}
async function action(fn){for(const b of document.querySelectorAll('button'))b.disabled=true;try{await fn()}catch(e){show(e.message)}finally{for(const b of document.querySelectorAll('button'))b.disabled=false}}
$('query').onclick=()=>action(async()=>{const r=await api('/api/tools/query_candidates',{arguments:{context:context()}});show(JSON.stringify(r,null,2))});
$('events').onclick=()=>action(async()=>{const r=await api('/api/tools/read_runtime_events',{arguments:{limit:10}});show(JSON.stringify(r,null,2))});
$('ask').onclick=()=>action(async()=>{const r=await api('/api/chat',{question:$('question').value,mode:$('answerMode').value,context:$('useContext').checked?context():null});show(r.answer);$('resultTitle').textContent=r.mode==='model'?'模型分析':'本地查询';for(const s of r.sources){const div=document.createElement('div');div.className='source';div.textContent='['+s.id+'] '+s.title+' · '+s.source;$('sources').append(div)}$('trace').textContent=JSON.stringify(await api('/api/traces/'+r.trace_id),null,2)});
$('location').onchange=()=>{const l=+$('location').value;if(l)$('mode').value=l===64?'ice':l===128?'pond':'route'};
api('/api/health').then(r=>{$('health').textContent=`${r.fish_count} 种鱼 · ${r.rod_count} 根鱼竿 · ${r.catalog_version} · ${r.model_configured?'模型已配置':'本地查询模式'}`}).catch(e=>{$('health').textContent=e.message});
api('/api/tools/list_rods',{arguments:{}}).then(r=>{for(const rod of r.data.rods){const o=document.createElement('option');o.value=rod.id;o.textContent=rod.id+' / '+rod.label;$('rod').append(o)}});
</script></html>
